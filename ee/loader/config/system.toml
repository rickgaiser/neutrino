# Name of loaded config, to show to user
name = "System settings and drivers"

# Default argument values
# Overwrite these from the command line
default_bsd = "no"
default_bsdfs = "exfat"
default_dvd = "no"
#default_ata0 = "mass:mydrive0.bin"
#default_ata0id = "mass:mydrive0_id.bin"
#default_ata1 = "mass:mydrive1.bin"
#default_mc0 = "mass:mymc0.bin"
#default_mc1 = "mass:mymc1.bin"
default_elf = "auto"
#default_gc = "12"
#default_gsm = "fp"
#default_cfg = ""
default_dbc = false
default_logo = false
# Optional in-game-reset destination. Empty returns to the PS2 Browser.
# NHDDL supplies its actual launch path on the command line.
#default_igr_path = "mc0:/path/to/launcher.elf"
# A short power-button press normally powers off. Enable only when a launcher
# deliberately wants it routed through the same restart path as the pad combo.
default_igr_power = false

# EE_CORE configuration
eecore.elf = "ee_core96.elf"

# Modules to load in emulation environment
[[module]]
file = "eesync.irx"
ioprp = "EESYNC"
env = ["EE"]
[[module]]
file = "imgdrv.irx"
func = "IMGDRV" # used by EECORE durion IOP reboot
env = ["EE"]
# By default the system rom0:UDNL will be used, but this can be overruled here
# Some games (like Auto Modellista) don't work over USB with the default UDNL.
[[module]]
file = "udnl.irx"
#file = "udnl-t300.irx"
func = "UDNL" # used by EECORE durion IOP reboot
env = ["EE"]
[[module]]
file = "fakemod.irx"
load_order = 30
env = ["EE"]

